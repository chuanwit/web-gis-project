# Nginx 配置: 智慧城市大屏 (端口 8080)
# 部署到 /etc/nginx/conf.d/smart-city.conf
# 不占用 80 端口, 与已有网站共存

server {
    listen 8080;
    server_name 101.37.211.21;

    # 前端静态资源
    root /var/www/smart-city/dist;
    index index.html;

    # SPA 路由回退（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（JS/CSS/图片带 hash，长期缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 所有 API 请求代理到 Express 服务(数据接口 + AI 服务)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # SSE 关键: 禁用缓冲，保证流式实时推送
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # 文件大小限制（AI 请求体）
    client_max_body_size 10m;
}


